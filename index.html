<!DOCTYPE html>
<html>
<head>
  <title>Bracelet Images</title>
  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border: 1px solid #eee;
      border-radius: 5px;
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    h1 {
      text-align: center;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Bracelet Gallery</h1>
  <div class="gallery" id="image-container"></div>

  <script>
    const container = document.getElementById('image-container');
    
    // Generate image elements for 1.jpg to 30.jpg
    for (let i = 1; i <= 30; i++) {
      const img = document.createElement('img');
      img.src = `${i}.jpg`;  // Using .jpg extension
      img.alt = `Bracelet ${i}`;
      img.loading = "lazy";  // Better performance
      
      // Create a wrapper div for each image
      const card = document.createElement('div');
      card.className = 'image-card';
      card.appendChild(img);
      
      // Add image number label
      const label = document.createElement('p');
      label.textContent = `Bracelet ${i}`;
      label.style.textAlign = 'center';
      card.appendChild(label);
      
      container.appendChild(card);
    }
  </script>
</body>
</html>
